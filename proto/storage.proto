syntax = "proto3";

package storage;


// ============================================================
// STORAGE NODE MESSAGES
// ============================================================

message UploadRequest {
    string file_id = 1;
    string filename = 2;
    int32 chunk_id = 3;
    int32 total_chunks = 4;
    bytes data = 5;
}

message UploadResponse {
    bool success = 1;
    string message = 2;
}


message DownloadRequest {
    string file_id = 1;
    string filename = 2;
    int32 chunk_id = 3;
}

message DownloadResponse {
    bool success = 1;
    string message = 2;
    bytes data = 3;
}


// ============================================================
// STORAGE NODE REGISTRATION
// ============================================================

message RegisterNodeRequest {
    string node_id = 1;
    string address = 2;
    int32 port = 3;
}

message RegisterNodeResponse {
    bool success = 1;
    string message = 2;
}


// ============================================================
// HEARTBEAT
// ============================================================

message HeartbeatRequest {
    string node_id = 1;
    string address = 2;
    int32 port = 3;
}

message HeartbeatResponse {
    bool success = 1;
    string message = 2;
}


// ============================================================
// NODE HEALTH
// ============================================================

message NodeHealthRequest {
    string node_id = 1;
}

message NodeHealthResponse {
    bool healthy = 1;
    string message = 2;
}


// ============================================================
// GET STORAGE NODES
// ============================================================

message GetNodesRequest {
}

message StorageNodeInfo {
    string node_id = 1;
    string address = 2;
    int32 port = 3;
    bool healthy = 4;
}

message GetNodesResponse {
    repeated StorageNodeInfo nodes = 1;
}


// ============================================================
// CHUNK METADATA
// ============================================================

message RecordChunkRequest {
    string file_id = 1;
    int32 chunk_id = 2;
    string node_id = 3;

    // File-level metadata
    string filename = 4;
    int64 file_size = 5;
    int32 total_chunks = 6;
}

message RecordChunkResponse {
    bool success = 1;
    string message = 2;
}
message GetFileRequest {
    string file_id = 1;
}

message FileChunkLocation {
    int32 chunk_id = 1;
    string node_id = 2;
}

message GetFileResponse {
    bool success = 1;
    string message = 2;
    string filename = 3;
    int64 file_size = 4;
    int32 total_chunks = 5;
    repeated FileChunkLocation chunks = 6;
}


// ============================================================
// SERVICES
// ============================================================

service StorageService {

    rpc UploadFile(
        UploadRequest
    ) returns (
        UploadResponse
    );

    rpc DownloadFile(
        DownloadRequest
    ) returns (
        DownloadResponse
    );

}

service MasterService {

    rpc RegisterNode(
        RegisterNodeRequest
    ) returns (
        RegisterNodeResponse
    );

    rpc Heartbeat(
        HeartbeatRequest
    ) returns (
        HeartbeatResponse
    );

    rpc CheckNodeHealth(
        NodeHealthRequest
    ) returns (
        NodeHealthResponse
    );

    rpc GetNodes(
        GetNodesRequest
    ) returns (
        GetNodesResponse
    );

    rpc RecordChunk(
        RecordChunkRequest
    ) returns (
        RecordChunkResponse
    );
    rpc GetFile(
        GetFileRequest
    ) returns (
        GetFileResponse
    );
}
